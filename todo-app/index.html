<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My To-Do List</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f4f1ea;
      --card: #ffffff;
      --ink: #2b2620;
      --muted: #8a8071;
      --accent: #c96f4a;
      --line: #e3dccd;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }
    main { width: 100%; max-width: 520px; }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 600;
      font-size: 1.9rem;
      margin-bottom: 0.25rem;
    }
    .sub { color: var(--muted); margin-bottom: 1.25rem; font-size: 0.95rem; }

    form {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.85rem 1rem;
      font-size: 1rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    .add-btn {
      padding: 0.85rem 1.2rem;
      font-size: 1rem;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    .add-btn:active { transform: scale(0.97); }

    .filters {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 0.75rem;
    }
    .filters button {
      padding: 0.4rem 0.9rem;
      font-size: 0.85rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--card);
      color: var(--muted);
      cursor: pointer;
    }
    .filters button.active {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
    }

    ul { list-style: none; }
    li {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0.8rem 1rem;
      margin-bottom: 0.5rem;
    }
    li input[type="checkbox"] {
      width: 1.25rem;
      height: 1.25rem;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }
    li span {
      flex: 1;
      line-height: 1.4;
      word-break: break-word;
    }
    li.done span {
      text-decoration: line-through;
      color: var(--muted);
    }
    .del {
      border: none;
      background: none;
      color: var(--muted);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0.2rem 0.4rem;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .del:hover { color: #b3402a; background: #f8e8e2; }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.75rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .clear {
      border: none;
      background: none;
      color: var(--muted);
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: underline;
    }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 2.5rem 1rem;
      font-style: italic;
    }
  </style>
</head>
<body>
  <main>
    <h1>My To-Do List</h1>
    <p class="sub">Tasks are saved on this device automatically.</p>

    <form id="form">
      <input id="input" type="text" placeholder="What needs doing?" autocomplete="off" autofocus />
      <button class="add-btn" type="submit">Add</button>
    </form>

    <div class="filters" id="filters">
      <button data-filter="all" class="active">All</button>
      <button data-filter="active">Active</button>
      <button data-filter="done">Done</button>
    </div>

    <ul id="list"></ul>
    <div class="empty" id="empty" hidden>Nothing here yet — add your first task above.</div>

    <div class="footer">
      <span id="count"></span>
      <button class="clear" id="clear" hidden>Clear completed</button>
    </div>
  </main>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const list = document.getElementById("list");
    const empty = document.getElementById("empty");
    const count = document.getElementById("count");
    const clearBtn = document.getElementById("clear");
    const filters = document.getElementById("filters");

    let todos = JSON.parse(localStorage.getItem("todos") || "[]");
    let filter = "all";

    function save() {
      localStorage.setItem("todos", JSON.stringify(todos));
    }

    function render() {
      list.innerHTML = "";
      const visible = todos.filter((t) =>
        filter === "all" ? true : filter === "done" ? t.done : !t.done
      );

      for (const todo of visible) {
        const li = document.createElement("li");
        if (todo.done) li.classList.add("done");

        const box = document.createElement("input");
        box.type = "checkbox";
        box.checked = todo.done;
        box.addEventListener("change", () => {
          todo.done = box.checked;
          save();
          render();
        });

        const span = document.createElement("span");
        span.textContent = todo.text;

        const del = document.createElement("button");
        del.className = "del";
        del.textContent = "✕";
        del.setAttribute("aria-label", "Delete task");
        del.addEventListener("click", () => {
          todos = todos.filter((t) => t !== todo);
          save();
          render();
        });

        li.append(box, span, del);
        list.appendChild(li);
      }

      empty.hidden = todos.length > 0;
      const remaining = todos.filter((t) => !t.done).length;
      count.textContent = todos.length
        ? `${remaining} task${remaining === 1 ? "" : "s"} left`
        : "";
      clearBtn.hidden = !todos.some((t) => t.done);
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      todos.unshift({ text, done: false });
      input.value = "";
      save();
      render();
    });

    clearBtn.addEventListener("click", () => {
      todos = todos.filter((t) => !t.done);
      save();
      render();
    });

    filters.addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      filter = btn.dataset.filter;
      for (const b of filters.querySelectorAll("button")) {
        b.classList.toggle("active", b === btn);
      }
      render();
    });

    render();
  </script>
</body>
</html>
