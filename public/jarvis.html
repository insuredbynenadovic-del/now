<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jarvis</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{--ink:#e9ebee;--ink2:#9aa1ab;--muted:#646a74;--surface:#14161a;--border:rgba(150,162,180,.16);--accent:#7f95ad;}
  html,body{height:100%;}
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#000;color:var(--ink);display:flex;flex-direction:column;height:100vh;}
  header{display:flex;align-items:center;gap:.7rem;padding:.7rem 1.1rem;border-bottom:1px solid var(--border);background:#0a0b0d;}
  .orb{width:34px;height:34px;border-radius:50%;position:relative;overflow:hidden;background:#0c0f13;border:1px solid rgba(174,188,204,.25);flex-shrink:0;}
  .orb::before{content:"";position:absolute;inset:-35%;background:conic-gradient(from 0deg,transparent,rgba(174,188,204,.85),transparent 38%,transparent 60%,rgba(127,149,173,.55),transparent 92%);animation:spin 2.1s linear infinite;}
  .orb::after{content:"";position:absolute;inset:22%;border-radius:50%;background:radial-gradient(circle at 40% 34%,#e6ecf2,#9fb0c2 42%,#3a414a 78%,#171b20 96%);}
  @keyframes spin{to{transform:rotate(360deg);}}
  header h1{font-size:1rem;font-weight:750;letter-spacing:1px;margin-right:auto;}
  header .status{font-size:.78rem;color:var(--muted);}
  .btn{padding:.45rem .8rem;font-size:.85rem;font-family:inherit;border:1px solid var(--border);border-radius:8px;background:#1b1e23;color:var(--ink);cursor:pointer;}
  .btn:hover{border-color:var(--accent);}
  #chat{flex:1;overflow-y:auto;padding:1.1rem;max-width:820px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:.8rem;}
  .msg{padding:.7rem .95rem;border-radius:12px;max-width:88%;white-space:pre-wrap;line-height:1.5;}
  .me{align-self:flex-end;background:#242830;border:1px solid var(--border);}
  .j{align-self:flex-start;background:var(--surface);border:1px solid var(--border);}
  .j.think{color:var(--muted);font-style:italic;}
  .err{align-self:flex-start;background:rgba(140,55,62,.2);border:1px solid rgba(196,103,111,.4);color:#e0a6ab;}
  form{display:flex;gap:.5rem;padding:.9rem 1.1rem;border-top:1px solid var(--border);max-width:820px;width:100%;margin:0 auto;}
  input[type=text]{flex:1;padding:.7rem .9rem;font-size:.95rem;font-family:inherit;border:1px solid var(--border);border-radius:10px;background:#111317;color:var(--ink);outline:none;}
  input[type=text]:focus{border-color:var(--accent);}
  button[type=submit]{padding:.7rem 1.1rem;border:none;border-radius:10px;background:#2c3138;color:var(--ink);font-weight:650;cursor:pointer;}
  button[type=submit]:disabled{opacity:.5;}
  .empty{color:var(--muted);text-align:center;margin:auto;max-width:460px;line-height:1.6;}
  .examples{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin-top:1rem;}
  .ex{font-size:.82rem;border:1px solid var(--border);border-radius:999px;padding:.35rem .75rem;color:var(--accent);cursor:pointer;background:none;}
  .ex:hover{border-color:var(--accent);color:var(--ink);}
</style>
</head>
<body>
<header>
  <div class="orb"></div>
  <h1>JARVIS</h1>
  <span class="status" id="status">No book loaded</span>
  <button class="btn" id="loadBtn">Load book</button>
  <input type="file" id="file" accept=".json" hidden />
</header>
<div id="chat">
  <div class="empty" id="empty">
    Load your book (the <b>.json</b> backup, or it auto-loads if you opened the Command Center here),
    then ask me anything about your leads.
    <div class="examples" id="examples"></div>
  </div>
</div>
<form id="form">
  <input type="text" id="q" placeholder="Ask about your leads…" autocomplete="off" />
  <button type="submit" id="send">Ask</button>
</form>

<script>
"use strict";
const $=id=>document.getElementById(id);
let leads=[];

function setStatus(){ $("status").textContent = leads.length ? (leads.length+" leads loaded") : "No book loaded"; }
function tryLocal(){ try{ const r=localStorage.getItem("scc_leads_v1"); if(r){ const a=JSON.parse(r); if(Array.isArray(a)&&a.length){ leads=a; setStatus(); } } }catch(e){} }
tryLocal();

$("loadBtn").addEventListener("click",()=>$("file").click());
$("file").addEventListener("change",async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{ const data=JSON.parse(await f.text()); leads=Array.isArray(data)?data:(data.leads||[]); setStatus(); }
  catch{ alert("That isn't a valid book file."); }
});

const EXAMPLES=["Who are my 5 best closes this week and why?","Which quoted leads are stalling on price?","Who should I call first today?","Draft a text for my ghosted leads"];
const exWrap=$("examples");
EXAMPLES.forEach(x=>{ const b=document.createElement("button"); b.className="ex"; b.textContent=x; b.onclick=()=>{ $("q").value=x; $("form").requestSubmit(); }; exWrap.appendChild(b); });

function bubble(text,cls){ const e=$("empty"); if(e) e.remove(); const d=document.createElement("div"); d.className="msg "+cls; d.textContent=text; $("chat").appendChild(d); $("chat").scrollTop=$("chat").scrollHeight; return d; }

$("form").addEventListener("submit",async e=>{
  e.preventDefault();
  const q=$("q").value.trim(); if(!q) return;
  if(!leads.length){ bubble("Load your book first (top-right).","err"); return; }
  $("q").value=""; $("send").disabled=true;
  bubble(q,"me");
  const pending=bubble("Thinking…","j think");
  try{
    const res=await fetch("/api/jarvis",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q,leads})});
    const data=await res.json();
    if(!res.ok){ pending.remove(); bubble(data.error||"Something went wrong.","err"); }
    else { pending.className="msg j"; pending.textContent=data.reply; }
  }catch(err){ pending.remove(); bubble("Can't reach the Jarvis server. Is it running? (npm start)","err"); }
  finally{ $("send").disabled=false; $("q").focus(); }
});
setStatus();
</script>
</body>
</html>
